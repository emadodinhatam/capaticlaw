name: CapatiClaw Native macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-native-macos:
    strategy:
      matrix:
        include:
          - arch: AppleSilicon
            swift_arch: arm64
          - arch: Intel
            swift_arch: x86_64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build gateway
        run: pnpm build:runtime

      - name: Build Swift app
        working-directory: apps/macos
        run: |
          echo "=== Swift version ==="
          swift --version 2>&1 | head -n 5
          xcodebuild -version 2>&1 | head -n 5
          echo "=== Building (${{ matrix.arch }} / ${{ matrix.swift_arch }}) ==="
          swift build -c release --arch ${{ matrix.swift_arch }} 2>&1 | tail -n 50
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "First build failed, trying without arch..."
            swift build -c release 2>&1 | tail -n 50
            BUILD_EXIT=${PIPESTATUS[0]}
          fi
          echo "=== Build exit: $BUILD_EXIT ==="
          echo "=== Result ==="
          ls -lh .build/release/CapatiClaw 2>&1 | head -n 10
          ls -lh .build/${{ matrix.swift_arch }}-apple-macosx/release/CapatiClaw 2>&1 | head -n 10
          ls -lh .build/release/ 2>&1 | head -n 20
          ls -lh .build/*/release/CapatiClaw 2>&1 | head -n 10
          if [ ! -f ".build/release/CapatiClaw" ] && [ ! -f ".build/${{ matrix.swift_arch }}-apple-macosx/release/CapatiClaw" ]; then
            echo "ERROR: Swift binary not found!"
            echo "=== Full build output ==="
            swift build -c release 2>&1 | head -n 100
            exit 1
          fi

      - name: Package .app bundle
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          ARCH="${{ matrix.arch }}"
          SWIFT_ARCH="${{ matrix.swift_arch }}"
          echo "Version: $VERSION Arch: $ARCH Swift: $SWIFT_ARCH"

          APP="CapatiClaw.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # Find Swift binary (arch-specific or generic)
          SWIFT_BIN=""
          for p in "apps/macos/.build/${SWIFT_ARCH}-apple-macosx/release/CapatiClaw" "apps/macos/.build/release/CapatiClaw"; do
            if [ -f "$p" ]; then SWIFT_BIN="$p"; break; fi
          done

          if [ -n "$SWIFT_BIN" ]; then
            cp "$SWIFT_BIN" "$APP/Contents/MacOS/CapatiClaw"
            chmod +x "$APP/Contents/MacOS/CapatiClaw"
            echo "Swift binary included ($ARCH from $SWIFT_BIN)"
            file "$APP/Contents/MacOS/CapatiClaw" 2>&1 | head -n 5
          else
            cat > "$APP/Contents/MacOS/CapatiClaw" << 'LAUNCHER'
          #!/bin/bash
          RESOURCES="$(cd "$(dirname "$0")/../Resources" && pwd)"
          BUNDLED_NODE="$RESOURCES/node/node"
          [ -x "$BUNDLED_NODE" ] && NODE="$BUNDLED_NODE" || NODE="node"
          if [ ! -t 1 ]; then
            if [ ! -f "$HOME/.openclaw/config.yaml" ] && [ ! -f "$HOME/.capaticlaw/config.yaml" ]; then
              CMD="clear; echo '🦞 CapatiClaw — راه‌اندازی'; echo ''; \"$NODE\" \"$RESOURCES/capaticlaw.mjs\" onboard --install-daemon"
            else
              CMD="clear; echo '🦞 CapatiClaw'; echo ''; \"$NODE\" \"$RESOURCES/capaticlaw.mjs\" dashboard"
            fi
            [ $# -gt 0 ] && CMD="clear; \"$NODE\" \"$RESOURCES/capaticlaw.mjs\" $*"
            if /usr/bin/osascript -e "tell application \"Terminal\" to activate" -e "tell application \"Terminal\" to do script \"$CMD\"" 2>/dev/null; then
            exit 0
          fi
          TMP_CMD=$(mktemp /tmp/capaticlaw-XXXXXX.command)
          echo "#!/bin/bash" > "$TMP_CMD"
          echo "$CMD" >> "$TMP_CMD"
          chmod +x "$TMP_CMD"
          open -a Terminal "$TMP_CMD" 2>/dev/null && exit 0
          /usr/bin/osascript -e 'display dialog "CapatiClaw: Terminal باز نشد. Terminal را باز کنید و capaticlaw dashboard را اجرا کنید." buttons {"OK"} default button "OK"' 2>/dev/null || true
            exit 0
          fi
          [ $# -eq 0 ] && exec "$NODE" "$RESOURCES/capaticlaw.mjs" dashboard || exec "$NODE" "$RESOURCES/capaticlaw.mjs" "$@"
          LAUNCHER
            chmod +x "$APP/Contents/MacOS/CapatiClaw"
            echo "Shell launcher used ($ARCH)"
          fi

          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>CapatiClaw</string>
            <key>CFBundleExecutable</key><string>CapatiClaw</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>com.capati.capaticlaw</string>
            <key>CFBundleName</key><string>CapatiClaw</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          echo -n "APPL????" > "$APP/Contents/PkgInfo"

          # App icon (Capati logo)
          if [ -f "apps/macos/Sources/OpenClaw/Resources/CapatiClaw.icns" ]; then
            cp "apps/macos/Sources/OpenClaw/Resources/CapatiClaw.icns" "$APP/Contents/Resources/AppIcon.icns"
            echo "Icon: CapatiClaw.icns"
          elif [ -f "apps/macos/Sources/OpenClaw/Resources/OpenClaw.icns" ]; then
            cp "apps/macos/Sources/OpenClaw/Resources/OpenClaw.icns" "$APP/Contents/Resources/AppIcon.icns"
            echo "Icon: OpenClaw.icns (fallback)"
          else
            echo "No icns found"
          fi
          ls -lh "$APP/Contents/Resources/AppIcon.icns" 2>&1 | head -n 3

          cp capaticlaw.mjs openclaw.mjs "$APP/Contents/Resources/" 2>/dev/null || true
          cp *.mjs "$APP/Contents/Resources/" 2>/dev/null || true
          cp package.json LICENSE "$APP/Contents/Resources/" 2>/dev/null || true
          cp -r dist "$APP/Contents/Resources/dist" 2>/dev/null || true
          mkdir -p "$APP/Contents/Resources/skills-capati"
          cp skills/capati/SKILL.md "$APP/Contents/Resources/skills-capati/" 2>/dev/null || true

          # Bundle Node for this arch
          mkdir -p "$APP/Contents/Resources/node"
          if [ "$ARCH" = "Intel" ]; then
            echo "Downloading Node x64 for Intel..."
            curl -fsSL "https://nodejs.org/dist/v24.21.0/node-v24.21.0-darwin-x64.tar.gz" -o /tmp/node-x64.tar.gz 2>&1 | head -n 3
            tar xzf /tmp/node-x64.tar.gz -C /tmp 2>&1 | head -n 3
            cp /tmp/node-v24.21.0-darwin-x64/bin/node "$APP/Contents/Resources/node/node" 2>/dev/null || echo "Node x64 bundle failed"
            rm -rf /tmp/node-x64.tar.gz /tmp/node-v24.21.0-darwin-x64 2>/dev/null || true
          else
            NODE_BIN=$(which node)
            cp "$NODE_BIN" "$APP/Contents/Resources/node/node" 2>/dev/null || echo "Node bundle skipped"
          fi
          chmod +x "$APP/Contents/Resources/node/node" 2>/dev/null || true
          file "$APP/Contents/Resources/node/node" 2>&1 | head -n 3

          echo "=== App bundle ($ARCH) ==="
          du -sh "$APP" 2>&1 | head -n 5

          tar czf "CapatiClaw-${VERSION}-macOS-${ARCH}-Native.tar.gz" -C . "$APP" 2>&1 | head -n 5
          ls -lh "CapatiClaw-${VERSION}-macOS-${ARCH}-Native.tar.gz" 2>&1 | head -n 5

          if command -v hdiutil >/dev/null 2>&1; then
            echo "Creating DMG ($ARCH)..."
            hdiutil create -volname "CapatiClaw" -srcfolder "$APP" -ov -format UDZO "CapatiClaw-${VERSION}-macOS-${ARCH}.dmg" 2>&1 | tail -n 10
            ls -lh "CapatiClaw-${VERSION}-macOS-${ARCH}.dmg" 2>&1 | head -n 5
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: capaticlaw-macos-native-${{ matrix.arch }}
          path: |
            CapatiClaw-*.tar.gz
            CapatiClaw-*.dmg
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CapatiClaw-*.tar.gz
            CapatiClaw-*.dmg
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
