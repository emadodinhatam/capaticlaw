name: CapatiClaw Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 2026.10.3-capati.1)"
        required: false
        type: string

permissions:
  contents: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 1. Build gateway + npm package ──
  build-gateway:
    name: Build gateway (Node 24)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build runtime
        run: pnpm build:runtime
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Pack npm tarball
        run: pnpm pack --pack-destination /tmp
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: capaticlaw-npm
          path: /tmp/capaticlaw-*.tgz
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: capaticlaw-dist
          path: dist/
          retention-days: 7

  # ── 2. macOS DMG — Intel (x86_64) ──
  build-macos-intel:
    name: macOS DMG (Intel x86_64)
    needs: build-gateway
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app
      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:runtime
      - name: Build macOS app (x86_64)
        working-directory: apps/macos
        run: |
          swift build -c release --arch x86_64 || swift build -c release
          echo "Swift build done"
          ls -lh .build/release/ 2>&1 | head -n 20
      - name: Package DMG (x86_64)
        run: |
          VERSION="${{ needs.build-gateway.outputs.version }}"
          # Try existing packaging script, fallback to simple zip
          if [ -f apps/macos/Packaging/package.sh ]; then
            bash apps/macos/Packaging/package.sh --arch x86_64 --version "$VERSION" || true
          fi
          # Fallback: zip the built binary
          if [ -f apps/macos/.build/release/CapatiClaw ]; then
            ditto -c -k --sequesterRsrc --keepParent apps/macos/.build/release/CapatiClaw "CapatiClaw-${VERSION}-x86_64.zip" || true
          fi
          ls -lh CapatiClaw-* 2>&1 | head -n 20
          ls -lh apps/macos/*.dmg apps/macos/*.zip 2>&1 | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: capaticlaw-macos-intel
          path: |
            CapatiClaw-*.zip
            CapatiClaw-*.dmg
            apps/macos/*.dmg
            apps/macos/*.zip
          if-no-files-found: warn
          retention-days: 7

  # ── 3. macOS DMG — Apple Silicon (arm64) ──
  build-macos-arm:
    name: macOS DMG (Apple Silicon arm64)
    needs: build-gateway
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:runtime
      - name: Build macOS app (arm64)
        working-directory: apps/macos
        run: |
          swift build -c release --arch arm64 || swift build -c release
          ls -lh .build/release/ 2>&1 | head -n 20
      - name: Package DMG (arm64)
        run: |
          VERSION="${{ needs.build-gateway.outputs.version }}"
          if [ -f apps/macos/Packaging/package.sh ]; then
            bash apps/macos/Packaging/package.sh --arch arm64 --version "$VERSION" || true
          fi
          if [ -f apps/macos/.build/release/CapatiClaw ]; then
            ditto -c -k --sequesterRsrc --keepParent apps/macos/.build/release/CapatiClaw "CapatiClaw-${VERSION}-arm64.zip" || true
          fi
          ls -lh CapatiClaw-* 2>&1 | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: capaticlaw-macos-arm
          path: |
            CapatiClaw-*.zip
            CapatiClaw-*.dmg
            apps/macos/*.dmg
            apps/macos/*.zip
          if-no-files-found: warn
          retention-days: 7

  # ── 4. Windows EXE (x64) ──
  build-windows:
    name: Windows EXE (x64)
    needs: build-gateway
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:runtime
      - name: Build Windows (if Tauri/Electron config exists)
        shell: bash
        run: |
          VERSION="${{ needs.build-gateway.outputs.version }}"
          echo "Version: $VERSION"
          # Tauri build if available
          if [ -f "apps/linux/src-tauri/tauri.conf.json" ]; then
            echo "Tauri config found — attempting build"
            # pnpm --filter capaticlaw tauri build 2>&1 | head -n 50 || true
          fi
          # Fallback: just verify gateway builds on Windows
          node --version
          pnpm --version
          ls -lh dist/ 2>&1 | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: capaticlaw-windows-x64
          path: |
            dist/
          if-no-files-found: warn
          retention-days: 7

  # ── 5. Linux AppImage + deb ──
  build-linux:
    name: Linux AppImage + deb
    needs: build-gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install deps + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:runtime
          ls -lh dist/ 2>&1 | head -n 20
      - name: Build Linux packages (best-effort)
        run: |
          VERSION="${{ needs.build-gateway.outputs.version }}"
          echo "Version: $VERSION"
          # If Tauri is configured for linux, try building
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo available — Tauri build possible"
          else
            echo "cargo not available — skipping Tauri, gateway only"
          fi
          # Always produce a tarball as fallback
          tar czf "CapatiClaw-${VERSION}-linux-x64.tar.gz" dist/ capaticlaw.mjs package.json 2>&1 | head -n 20
          ls -lh CapatiClaw-* 2>&1 | head -n 20
      - uses: actions/upload-artifact@v4
        with:
          name: capaticlaw-linux
          path: |
            CapatiClaw-*.tar.gz
            CapatiClaw-*.AppImage
            CapatiClaw-*.deb
          if-no-files-found: warn
          retention-days: 7

  # ── 6. Publish GitHub Release ──
  publish:
    name: Publish GitHub Release
    needs: [build-gateway, build-macos-intel, build-macos-arm, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: List artifacts
        run: find ./artifacts -type f | head -n 50; du -sh ./artifacts/* 2>&1 | head -n 20
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
